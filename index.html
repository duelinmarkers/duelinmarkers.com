{% for post in site.posts %}
<article>
  {% if post.excerpt_image %}<img class="floatright" src="{{ post.excerpt_image }}">{% endif %}
  <h3>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </h3>
  <time class="post-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date_to_long_string }}</time>
  {{ post.excerpt }}
  <a href="{{ post.url }}">read more...</a>
</article>
{% endfor %}
